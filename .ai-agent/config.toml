# Sample project-local config for open-coding-agent

cwd = "."
max_turns = 30
max_tool_output_tokens = 8000

developer_instructions = "Keep answers concise and prioritize safe file operations."
user_instructions = "When uncertain, show assumptions before action."
debug = false

[model]
name = "openai/gpt-4o-mini"
temperature = 0.4
context_window = 128000


[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/rivaanranawat/Desktop/ai-agent", "/tmp"]

[mcp_servers.filesystem2]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem222222222222", "/Users/rivaanranawat/Desktop/ai-agent", "/tmp"]